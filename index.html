<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gionzana · apps</title>
<meta name="description" content="Little apps for everyday things: offline, no account. Your data stays on your phone.">
<meta name="theme-color" content="#f6f8fa">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f6f8fa'/%3E%3Ctext x='29' y='46' font-family='Georgia,serif' font-size='40' text-anchor='middle' fill='%232E1A47'%3Eg%3C/text%3E%3Ccircle cx='50' cy='22' r='6' fill='%23F2994A'/%3E%3C/svg%3E">
<style>
  /* GitHub's light palette, with gionzana's purple and orange for the name and buttons. Light only. */
  :root {
    --page: #ffffff;
    --head: #f6f8fa;
    --line: #d0d7de;
    --ink: #1f2328;
    --muted: #59636e;
    --link: #0969da;
    --purple: #2E1A47;
    --orange: #F2994A;
    --orange-press: #e2873a;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }
  a { color: var(--link); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  header { background: var(--head); border-bottom: 1px solid var(--line); }
  header .wrap { padding-top: 20px; padding-bottom: 22px; position: relative; }
  .logo { display: block; height: 34px; width: auto; max-width: 70%; }
  .logo-text { font-family: Georgia, "Times New Roman", serif; font-size: 34px; letter-spacing: 4px; color: var(--purple); line-height: 1; }
  .logo-text span { color: var(--orange); }
  h1 { margin: 14px 0 4px; font-size: 20px; font-weight: 600; line-height: 1.3; }
  .promise { margin: 0; color: var(--muted); font-size: 14px; }
  .lang {
    position: absolute; top: 18px; right: 16px;
    font: inherit; font-size: 13px; color: var(--muted);
    background: var(--page); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 10px; min-height: 32px; cursor: pointer;
  }

  main { padding-top: 16px; padding-bottom: 8px; }
  .apps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .app {
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--line); border-radius: 8px; padding: 12px;
  }
  .app img { width: 48px; height: 48px; border-radius: 11px; flex: none; background: var(--head); }
  .app .text { flex: 1; min-width: 0; }
  .app h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .app h2 a { text-decoration: none; }
  .app h2 a:hover { text-decoration: underline; }
  .app p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .open {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    min-height: 36px; padding: 0 14px; border-radius: 6px;
    background: var(--orange); color: var(--purple);
    font-size: 14px; font-weight: 600; text-decoration: none;
  }
  .open:active { background: var(--orange-press); }

  .tip { margin: 18px 0 0; padding: 12px; background: var(--head); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; color: var(--muted); }

  footer { padding: 22px 0 32px; text-align: center; font-size: 13px; color: var(--muted); }
  footer p { margin: 4px 0; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <img class="logo" src="wordmark.png" alt="gionzana"
         onerror="this.outerHTML='<div class=&quot;logo-text&quot;>gionzana<span>•</span></div>'">
    <button class="lang" id="lang" type="button" aria-label="Italiano">IT</button>
    <h1 data-t="tagline">Little apps for everyday things</h1>
    <p class="promise" data-t="promise">Offline, no account. Your data stays on your phone.</p>
  </div>
</header>

<main class="wrap">
  <ul class="apps" id="apps"></ul>
  <p class="tip" data-t="tip">To install an app: open it in Chrome on your phone, tap ⋮ and choose “Install app”. It then works like any other app, even offline.</p>
</main>

<footer class="wrap">
  <p><span data-t="madeBy">made by gionzana</span> · <a href="https://buymeacoffee.com/gionzana" data-t="coffee">☕ buy me a coffee</a></p>
  <p><span data-t="codeOn">the code is on</span> <a href="https://github.com/rb-gith?tab=repositories">github</a></p>
</footer>

<script>
  // To add a new app: add one line to APPS (newest first) and its text in both languages.
  var BASE = 'https://rb-gith.github.io/';
  var APPS = [
    { name: 'Tasca',            repo: 'tasca',
      en: 'Your shop cards in your pocket: scan once, show the barcode at the till.',
      it: 'Le tue carte fedeltà in tasca: scansiona una volta, mostra il codice alla cassa.' },
    { name: 'Tempo',            repo: 'tempo',
      en: 'Log the hours you spend on each project, with totals per week, month and year.',
      it: 'Segna le ore dedicate a ogni progetto, con i totali per settimana, mese e anno.' },
    { name: 'ELF',              repo: 'elf',
      en: 'Gift ideas for Christmas, birthdays and every occasion, from idea to given.',
      it: 'Idee regalo per Natale, compleanni e ogni occasione, dall’idea al regalo consegnato.' },
    { name: 'Spines',           repo: 'spines',
      en: 'Your books as colourful spines on a wooden shelf.',
      it: 'I tuoi libri come dorsi colorati su una mensola di legno.' },
    { name: 'Habits',           repo: 'habit-tracker_r',
      en: 'Tick your daily habits and watch the streaks and colours grow.',
      it: 'Spunta le tue abitudini quotidiane e guarda crescere serie e colori.' },
    { name: 'Respira',          repo: 'respira',
      en: 'Calm, guided breathing exercises.',
      it: 'Esercizi di respirazione guidata, per ritrovare la calma.' },
    { name: 'Particle Mahjong', repo: 'particle_m',
      en: 'Mahjong solitaire with particle physics tiles, and a science fact on every win.',
      it: 'Mahjong solitario con tessere di fisica delle particelle, e una curiosità scientifica a ogni vittoria.' }
  ];

  var TEXT = {
    en: {
      tagline: 'Little apps for everyday things',
      promise: 'Offline, no account. Your data stays on your phone.',
      open: 'Open',
      tip: 'To install an app: open it in Chrome on your phone, tap ⋮ and choose “Install app”. It then works like any other app, even offline.',
      madeBy: 'made by gionzana',
      coffee: '☕ buy me a coffee',
      codeOn: 'the code is on',
      other: 'IT', otherLabel: 'Italiano'
    },
    it: {
      tagline: 'Piccole app per le cose di tutti i giorni',
      promise: 'Offline, senza account. I tuoi dati restano sul tuo telefono.',
      open: 'Apri',
      tip: 'Per installare un’app: aprila in Chrome sul telefono, tocca ⋮ e scegli “Installa app”. Poi funziona come tutte le altre app, anche offline.',
      madeBy: 'creata da gionzana',
      coffee: '☕ offrimi un caffè',
      codeOn: 'il codice è su',
      other: 'EN', otherLabel: 'English'
    }
  };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function pickLang() {
    var saved = null;
    try { saved = localStorage.getItem('gionzana-home-lang'); } catch (e) {}
    if (saved === 'en' || saved === 'it') return saved;
    var nav = (navigator.language || 'en').toLowerCase();
    return nav.indexOf('it') === 0 ? 'it' : 'en';
  }

  var lang = pickLang();

  function render() {
    var t = TEXT[lang];
    document.documentElement.lang = lang;
    var nodes = document.querySelectorAll('[data-t]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t[nodes[i].getAttribute('data-t')];
    var btn = document.getElementById('lang');
    btn.textContent = t.other;
    btn.setAttribute('aria-label', t.otherLabel);

    var html = '';
    for (var j = 0; j < APPS.length; j++) {
      var a = APPS[j], url = BASE + a.repo + '/';
      html += '<li class="app">' +
        '<img src="' + url + 'icons/icon-192.png" alt="" width="48" height="48" loading="lazy">' +
        '<div class="text"><h2><a href="' + url + '">' + esc(a.name) + '</a></h2>' +
        '<p>' + esc(a[lang]) + '</p></div>' +
        '<a class="open" href="' + url + '" aria-label="' + esc(t.open + ' ' + a.name) + '">' + esc(t.open) + '</a>' +
        '</li>';
    }
    document.getElementById('apps').innerHTML = html;
  }

  document.getElementById('lang').addEventListener('click', function () {
    lang = lang === 'en' ? 'it' : 'en';
    try { localStorage.setItem('gionzana-home-lang', lang); } catch (e) {}
    render();
  });

  render();
</script>
</body>
</html>
